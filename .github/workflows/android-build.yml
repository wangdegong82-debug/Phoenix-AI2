name: android-build

on:
  push:
    branches: ["main"]
    paths:
      - "android/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: android
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/PhoenixAI-main-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhoenixAI-main-debug
          path: dist/PhoenixAI-main-debug.apk
          if-no-files-found: error
          retention-days: 14
